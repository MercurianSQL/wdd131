<!DOCTYPE html>

<head>

    <title>Acme Table</title>
    <meta description="build a table with Accessibility Features and n-th row pseudo class striping">

    <link rel="stylesheet" href="styles/table.css">

</head>

                        ✔️

                    <td>Feature 3

    </main>
    <footer></footer>
</body>

</html>
